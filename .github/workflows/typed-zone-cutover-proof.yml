name: TYPED-ZONE CUTOVER — 0276 disposable proof (no production)

# Proves migration 0276 (typed_zone_pirate_cutover) on a THROWAWAY local Supabase — NEVER prod.
# This is the ONLY slice that can change a player outcome, so the proof drives the REAL evaluator —
# the function the mover actually calls — under BOTH flag states over real geometry.
#
#   * `supabase start` applies the full chain incl. 0276, so its self-assert runs against real
#     Postgres (lands dark; the cutover flag read EXACTLY ONCE into a local and only AFTER the
#     pirate_intercept_enabled dark gate; both deciders present with the legacy one intact; the typed
#     branch fails CLOSED; every shared downstream anchor surviving with exactly ONE roll and ONE
#     pirate_intercepts insert; ACL unchanged) — any regression ABORTS `supabase start` red.
#   * the SQL proof then shows the flag is the ONLY difference: dark selects by geometry alone (the
#     deeper zone, even though it declares no effect); lit selects by declared EFFECTS (the shallow
#     zone, because only it carries one); give the deep zone an effect and lit converges on the same
#     zone AND the same risk as legacy. It also drives the real evaluator under both states, proves a
#     non-moving leg logs nothing, and proves pirate_intercept_enabled still overrides everything.
#
# The flag is flipped INSIDE the transaction and rolled back: the disposable DB never stays lit.
# NO `environment:` on any job ⇒ none can read production secrets.

on:
  workflow_dispatch:
  push:
    branches:
      - 'autopilot/**'
      - 'slice-typed-zone-cutover**'
      - 'slice-typed-zone-shadow**'

permissions:
  contents: read

concurrency:
  group: typed-zone-cutover-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase (applies the full chain incl. 0276 + its self-assert)
        run: supabase start
      - name: Export disposable DB_URL (no secrets)
        run: |
          supabase status -o env | tee /tmp/sbenv >/dev/null
          grep -E '^DB_URL=' /tmp/sbenv || true
      - name: TYPED-ZONE CUTOVER proof (dark vs lit over the real evaluator)
        run: |
          set -a; . /tmp/sbenv; set +a
          : "${DB_URL:?DB_URL (disposable stack) required}"
          out="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/typed-zone-cutover-proof.sql 2>&1)"
          echo "$out"
          for marker in \
            TZC_PASS_DARK_LEGACY_DECIDES \
            TZC_PASS_LIT_EFFECTS_DECIDE \
            TZC_PASS_FLAG_IS_THE_ONLY_DIFFERENCE \
            TZC_PASS_EVALUATOR_BOTH_STATES \
            TZC_PASS_DARK_GATE_WINS \
            TZC_PASS_ROLLED_BACK ; do
            echo "$out" | grep -q "$marker" || { echo "MISSING MARKER: $marker"; exit 1; }
          done
          echo "$out" | grep -q 'TZC_FAIL' && { echo "A TZC_FAIL marker was emitted"; exit 1; }
          echo "ALL TYPED-ZONE CUTOVER MARKERS PRESENT"
      - name: Assert the database was left DARK and clean
        run: |
          set -a; . /tmp/sbenv; set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            do \$\$
            begin
              if exists (select 1 from public.danger_zones where name like 'TZC %') then
                raise exception 'PROOF LEAKED: a fixture zone was committed';
              end if;
              if coalesce(public.cfg_bool('typed_zone_pirate_intercept_runtime_enabled'), true) then
                raise exception 'PROOF LEAKED: the cutover flag was left LIT';
              end if;
              raise notice 'TZC_PASS_LEFT_DARK';
            end \$\$;"
