name: COMBAT-SPATIAL — 0234 spatial-combat disposable proof (no production)

# Runs the COMBAT-SPATIAL disposable proof on a throwaway local Supabase — NEVER production:
#   1. DB-free selftest: the harness is well-formed, self-rolling-back (opens a txn, toggles every
#      dark capability flag ONLY inside it, ends in ROLLBACK with NO COMMIT), obeys the sole-writer
#      law (group_sortie_members/combat_units are never hand-written — provisioning + the encounter/
#      tick go through the real RPCs and engine functions only), and pins every property assert in
#      assert-form;
#   2. a disposable local Supabase (the full chain incl. 0234) running the real-chain scenario:
#      commission 3 ships → craft/fit 2 real weapons → form a team, designate a command ship → send
#      the hunt → settle arrival (spawns the spatial encounter) → tick 1 (KITE/CLOSE movement, the
#      DERIVED player fire count, pirate hp falls) → a derived-length guarded approach → the arrived
#      HOLD, and the S1 aggro-tier screen holding (only an escort takes the hit, never the lead).
#      0336 REPOINTED THIS SCENARIO, and the reason is worth stating: the wave no longer spawns ON
#      the anchor. It stands at (the player formation's own extent + the wave's own weapon range + 1),
#      so no player hull is inside the wave's reach at spawn — and `hold` requires BOTH
#      `dist <= my_range` and `dist <= target_range`, the second of which is now false by
#      construction. There is therefore no knob setting that puts the lead in HOLD on tick 1; asking
#      for one would be asking for 0336 to be reverted. HOLD is proven where it now exists: on the
#      hull that CLOSES to contact. The lead, on the anchor, is now the furthest player hull from the
#      wave rather than the nearest.
# HOST DECISION (recorded, the decks-proof.yml precedent): this is a NEW, standalone workflow rather
# than a block appended to fleetgo-proof or team-command-proof — both of those pairs are CONTENDED by
# concurrently in-flight slices repointing them. The proof flips NO committed flag; no `environment:`
# on any job — none can read production secrets.

on:
  workflow_dispatch:
  # main + pull_request are NOT decoration — they are what stops this gate going dark (added 0313).
  # The trigger list used to be slice-branch-only, so between 2026-07-18 and 2026-08-02 this proof
  # ran on ZERO pushes, and migration 0300 (lights-on) broke it silently for that whole window; it
  # surfaced only because a later slice happened to name itself into the list. A proof that fires
  # only on the branch that edits it gates nothing. Every PR and every merge to main runs it now.
  pull_request:
  push:
    branches:
      - main
      - 'autopilot/**'
      # 0336 collapses the hand-maintained slice list into one glob: this proof reads the LIVE
      # process_combat_ticks geometry, so EVERY slice branch must run it, not the ones that
      # remembered to add themselves. That list is how this gate went dark for two weeks once.
      - 'slice-**'
      # The named entries this glob replaces are kept as history, not as triggers: 0313 cut the
      # seeded ranges this proof's geometry sits on (catalog gun 150->25); 0316 divided that gun
      # again (25 -> 5) and the engineered ring/pirate geometry was re-sized against it; 0317
      # rewrote calculate_expedition_stats and combat_create_group_encounter and repointed the
      # weapon-power assertions; 0336 moved the wave off the anchor entirely. Every one of those
      # had to remember to add itself. That is the failure mode, so the list is now a glob.

permissions:
  contents: read

concurrency:
  group: combat-spatial-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/combat-spatial-proof.sh selftest

  disposable-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase (applies the full migration chain incl. 0234)
        run: supabase start
      - name: Export disposable DB_URL (no secrets)
        run: |
          supabase status -o env | tee /tmp/sbenv >/dev/null
          grep -E '^DB_URL=' /tmp/sbenv || true
      - name: COMBAT-SPATIAL real-chain scenario
        run: |
          set -a; . /tmp/sbenv; set +a
          bash scripts/combat-spatial-proof.sh local
      - name: Stop disposable stack (always)
        if: always()
        run: supabase stop --no-backup || true
