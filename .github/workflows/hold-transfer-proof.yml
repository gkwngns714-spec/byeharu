name: ITEMS-HAVE-A-PLACE — hold ↔ port storage transfer disposable proof (no production)

# Runs the ITEMS-HAVE-A-PLACE disposable proof on a single throwaway local Supabase — NEVER
# production:
#   1. DB-free selftest: the harness is well-formed, self-rolling-back (opens a txn, toggles every
#      flag it needs ONLY inside it — and FORCES station_storage_enabled false for the dark block
#      rather than trusting the chain's seed — provisions via the REAL RPCs
#      (commission_first_main_ship / reward_grant / base_items_add / command_ship_group_go; never a
#      direct player_inventory, base_items or item_transfer_receipts insert) and ends in ROLLBACK
#      with NO COMMIT, so it persists nothing);
#   2. a disposable local Supabase (the full chain incl. 0332) running the real-chain matrix:
#      dark gate (both directions reject before any read, zero writes) → volume catalog pins (every
#      item positive, the owner-set five, 25 ore per 50 m³ hull, a zero-volume item refused by the
#      live constraint) → hold↔storage round trip with exact deltas and CONSERVATION → capacity
#      REFUSED-never-clamped at an exact boundary → LAW 3 three ways (a port you are not docked at
#      is unreachable · the verb takes no port argument at all · a ship in transit is refused) →
#      cross-player isolation → atomic replay in both directions → the full guard envelope → the
#      read surfaces → the ACL lockdown.
# The proof flips NO committed flag. No `environment:` on any job — none can read production secrets.
# Disposable local Supabase only. (Modeled on port-shop-proof.yml / salvage-market flow, reusing
# scripts/lib/trade-proof-lib.sh.)

on:
  workflow_dispatch:
  push:
    branches:
      - 'autopilot/**'
      - 'slice-**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: hold-transfer-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/hold-transfer-proof.sh selftest

  disposable-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase (applies the full migration chain incl. 0332)
        run: supabase start
      - name: Export disposable DB_URL (no secrets)
        run: |
          supabase status -o env | tee /tmp/sbenv >/dev/null
          grep -E '^DB_URL=' /tmp/sbenv || true
      - name: ITEMS-HAVE-A-PLACE real-chain matrix (hold ↔ port storage)
        run: |
          set -a; . /tmp/sbenv; set +a
          bash scripts/hold-transfer-proof.sh local
      - name: Stop disposable stack (always)
        if: always()
        run: supabase stop --no-backup || true
