name: DANGER-ZONE COMBAT — intercept→spatial disposable proof (no production)

# Proves the owner's #1 chain on a throwaway local Supabase — NEVER production:
#   1. DB-free selftest: the harness is well-formed, self-rolling-back, toggles every dark flag ONLY
#      inside the txn, provisions + sends through the REAL RPCs (group_sortie_members/combat_units are
#      never hand-written), risk knobs = 1.0 for a certain hit, and every property is asserted.
#   2. a disposable local Supabase (the full chain incl. migrations 0233/0234/0236) running the real
#      scenario: commission + arm a ship → form a team → draw a danger zone on the departure leg →
#      command_ship_group_go THROUGH it → assert intercepted + a SPATIAL encounter opened (positioned
#      combat_units) → one process_combat_ticks() → assert a spawned + firing synthetic pirate + damage.
#      The same `supabase start` also APPLIES migration 0236's own self-assert (the reliable-ambush risk
#      floor) against the real chain — the CI apply-proof net.
# HOST DECISION: a NEW, standalone workflow (the combat-spatial-proof.yml / decks-proof.yml precedent) —
# no `environment:` on any job, so none can read production secrets. Flips NO committed flag.

on:
  workflow_dispatch:
  # 0313 rev.3 — THIS PROOF MUST GATE EVERY PR AND EVERY MERGE, not just the branches that remembered
  # to name themselves. It now carries the behaviour blocks for 0310 (AUTOEXIT), 0311 (REPOSITION /
  # REPOOVERLAP / REPOOUTSIDE / REPOMODE), 0312 (NOLIVE), 0313 (CLOSURE) and 0314 (RSFEEL) — 20 markers
  # in all — plus the seven-generator parity gate. A branch-glob-only trigger means a branch that misses
  # can change the combat tick and run none of it. That is not hypothetical: the sibling proofs
  # combat-spatial and combat-fallback were branch-glob-only, went dark for three weeks, were silently
  # broken by 0300 that whole time, and were found only by accident during this slice. Same failure
  # mode, larger blast radius. `pull_request` catches it before it lands; `main` catches what a PR
  # filter misses (admin-override merges, direct pushes).
  pull_request:
  push:
    branches:
      - main
      - 'autopilot/**'
      # ██ COLLAPSED (0335). Fifteen hand-appended `slice-<topic>**` globs used to live here, each
      # added by the slice that needed it, and EVERY comment in that list warned of the same thing: a
      # branch that forgets to name itself runs none of this. That list WAS the bug it kept warning
      # about — one authority for "which branches run the combat gate", not fifteen kept in step by
      # hand across every merge. `slice-**` is that authority: it strictly widens coverage (every
      # previous glob is a prefix of it), it cannot be half-un-gated by a merge that takes one side of
      # a UNION, and there is nothing left to remember to append. `main` and `pull_request` above
      # still catch admin-override merges and direct pushes.
      - 'slice-**'
      - 'osn3-**'
      - 'wt-intercept**'

permissions:
  contents: read

concurrency:
  group: danger-combat-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ── NODE + node_modules, because the selftest now runs check-plpgsql-parse ─────────────────
      # This job used to be checkout-and-run, and that was correct: every gate the selftest called
      # was a grep or a Node script using only builtins, so it never needed an install.
      # check-plpgsql-parse (0351) needs a REAL PostgreSQL to parse and compile with, and that is
      # @electric-sql/pglite — a devDependency since a484204 (WASM: no Docker, no server, no service
      # container). The package was in package.json and package-lock.json all along; what was missing
      # was any step that installed it HERE.
      # THE GATE REFUSED TO PRETEND, WHICH IS HOW THIS WAS FOUND. Its non-vacuity floors turned
      # "I verified nothing" into a RED instead of a silent pass. Do not resolve that by letting the
      # gate skip when the package is absent — install the package, which is what this step does.
      # --ignore-scripts: pglite is prebuilt WASM and needs no postinstall, and skipping lifecycle
      # scripts keeps this job from downloading Playwright browsers it will never use.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash scripts/danger-combat-proof.sh selftest

  disposable-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase (applies the full migration chain incl. 0233/0234/0236)
        run: supabase start
      - name: Export disposable DB_URL (no secrets)
        run: |
          supabase status -o env | tee /tmp/sbenv >/dev/null
          grep -E '^DB_URL=' /tmp/sbenv || true
      - name: DANGER-ZONE COMBAT real-chain scenario
        run: |
          set -a; . /tmp/sbenv; set +a
          bash scripts/danger-combat-proof.sh local
      - name: Stop disposable stack (always)
        if: always()
        run: supabase stop --no-backup || true
