name: DANGER-ZONE COMBAT — intercept→spatial disposable proof (no production)

# Proves the owner's #1 chain on a throwaway local Supabase — NEVER production:
#   1. DB-free selftest: the harness is well-formed, self-rolling-back, toggles every dark flag ONLY
#      inside the txn, provisions + sends through the REAL RPCs (group_sortie_members/combat_units are
#      never hand-written), risk knobs = 1.0 for a certain hit, and every property is asserted.
#   2. a disposable local Supabase (the full chain incl. migrations 0233/0234/0236) running the real
#      scenario: commission + arm a ship → form a team → draw a danger zone on the departure leg →
#      command_ship_group_go THROUGH it → assert intercepted + a SPATIAL encounter opened (positioned
#      combat_units) → one process_combat_ticks() → assert a spawned + firing synthetic pirate + damage.
#      The same `supabase start` also APPLIES migration 0236's own self-assert (the reliable-ambush risk
#      floor) against the real chain — the CI apply-proof net.
# HOST DECISION: a NEW, standalone workflow (the combat-spatial-proof.yml / decks-proof.yml precedent) —
# no `environment:` on any job, so none can read production secrets. Flips NO committed flag.

on:
  workflow_dispatch:
  # 0313 rev.3 — THIS PROOF MUST GATE EVERY PR AND EVERY MERGE, not just the branches that remembered
  # to name themselves. It now carries the behaviour blocks for 0310 (AUTOEXIT), 0311 (REPOSITION /
  # REPOOVERLAP / REPOOUTSIDE / REPOMODE), 0312 (NOLIVE), 0313 (CLOSURE) and 0314 (RSFEEL) — 20 markers
  # in all — plus the seven-generator parity gate. A branch-glob-only trigger means a branch that misses
  # can change the combat tick and run none of it. That is not hypothetical: the sibling proofs
  # combat-spatial and combat-fallback were branch-glob-only, went dark for three weeks, were silently
  # broken by 0300 that whole time, and were found only by accident during this slice. Same failure
  # mode, larger blast radius. `pull_request` catches it before it lands; `main` catches what a PR
  # filter misses (admin-override merges, direct pushes).
  pull_request:
  push:
    branches:
      - main
      - 'autopilot/**'
      - 'slice-danger-combat**'
      # 0301 moved the ambush off the order path; this proof is now the apply-and-behaviour gate for
      # every intercept-touching branch, so it must fire on them.
      - 'wt-intercept**'
      - 'slice-intercept**'
      # 0308 rewrites the encounter builder + the ambush resolver — roster-touching branches must
      # run the intercept apply-and-behaviour gate too.
      - 'slice-combat-roster**'
      # 0311 rewrites the mover's mid-combat arm (reposition inside the fight's zone) and this proof
      # carries its three behaviour blocks — the branch must fire this gate or the net is empty.
      - 'slice-reposition**'
      # 0310 rewrites the combat tick itself (the HP auto-exit arm) and this proof carries its
      # behaviour block (DZCOMBAT_PASS_AUTOEXIT) — auto-exit branches must run it.
      - 'slice-combat-auto-exit**'
      # 0312 rewrites the mover + the dock verb (the no-living-ships guard) and this proof carries
      # its behaviour block (DZCOMBAT_PASS_NOLIVE) — dead-fleet branches must run it.
      - 'slice-no-living-ships**'
      # 0313 cuts the weapon ranges below the spawn gap and this proof carries its behaviour block
      # (DZCOMBAT_PASS_CLOSURE — units MOVE, fire only after closure) — range branches must run it.
      # UNION at the 0312/0313 merge, and AGAIN at 0313/0314: every side appended a branch here, so
      # taking any one whole would silently un-gate the other slices' own proof blocks.
      - 'slice-weapon-ranges**'
      # 0314 rewrites the combat tick again (real attack intervals + per-hit rolls + the visible
      # hitsplat) and this proof carries its behaviour block (DZCOMBAT_PASS_RSFEEL).
      - 'slice-runescape-**'
      # 0315 rewrites the ENCOUNTER BUILDER itself (every fleet entering combat gets a lead, flagged
      # or not) and this proof carries its behaviour block (DZCOMBAT_PASS_LEAD) — a formation branch
      # that does not fire this gate ships with nothing but its own text self-asserts behind it.
      - 'slice-every-fleet**'
      # 0316 divides EVERY combat distance and rate by 5 (ranges, the formation ring, the enemy
      # speeds and projectile speeds by config; the player's world-travel speed converted into a
      # combat speed by a new knob read in the encounter builder). This proof carries the CLOSURE
      # block, which 0316 turned into a pinned tick-count property — a five-times-tighter branch
      # that does not fire this gate ships the whole geometry on text self-asserts alone.
      - 'slice-combat-five-times**'
      # 0320 DELETES eight game_config rows and writes three more. Its whole safety argument is an
      # apply-time precondition ("no function in this database mentions these keys") that only a real
      # Postgres can evaluate — a static read of the file proves nothing about it. This proof is the
      # `supabase start` that applies the chain INCLUDING 0320, so a knob branch that does not fire
      # it ships a DELETE against the live config table on text self-asserts alone.
      - 'slice-knobs**'

permissions:
  contents: read

concurrency:
  group: danger-combat-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/danger-combat-proof.sh selftest

  disposable-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase (applies the full migration chain incl. 0233/0234/0236)
        run: supabase start
      - name: Export disposable DB_URL (no secrets)
        run: |
          supabase status -o env | tee /tmp/sbenv >/dev/null
          grep -E '^DB_URL=' /tmp/sbenv || true
      - name: DANGER-ZONE COMBAT real-chain scenario
        run: |
          set -a; . /tmp/sbenv; set +a
          bash scripts/danger-combat-proof.sh local
      - name: Stop disposable stack (always)
        if: always()
        run: supabase stop --no-backup || true
